name: Terraform Format

on:
  pull_request:
    paths:
      - "modules/**"
      - ".github/workflows/tf_format.yaml"

permissions:
  contents: read

jobs:
  terraform_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      # `terraform validate` used to run here against the repo root, which has
      # no .tf files -- it reported "Success! The configuration is valid." on an
      # empty directory and never validated anything. Real per-root validation
      # lives in checks.yaml, which inits each root first.
