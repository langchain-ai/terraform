name: Values Check

# Fails a PR (or push to main) if any tracked Helm values file no longer renders
# against the chart line the providers are pinned to. This is what catches values
# the chart has renamed or removed before a customer hits it on deploy.

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/**/helm/values/**'
      - 'modules/**/helm/scripts/deploy.sh'
      - '.github/fixtures/**'
      - '.github/scripts/values-render.sh'
      - '.github/workflows/values-check.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**/helm/values/**'
      - 'modules/**/helm/scripts/deploy.sh'
      - '.github/fixtures/**'
      - '.github/scripts/values-render.sh'

permissions:
  contents: read

jobs:
  values-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Render every tracked values combination
        run: |
          chmod +x .github/scripts/values-render.sh
          .github/scripts/values-render.sh
