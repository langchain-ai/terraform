name: Terraform & Shell Checks

on:
  pull_request:
    paths:
      - "modules/**"
      - "agents/**"
      - ".github/scripts/**"
      - ".github/actions/setup-shellcheck/**"
      - ".github/workflows/checks.yaml"
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "agents/**"
      - ".github/scripts/**"
      - ".github/actions/setup-shellcheck/**"
      - ".github/workflows/checks.yaml"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per provider so a failure names the provider, and so the provider
  # rulesets install in parallel. Only the directory names live here: check.sh
  # expands modules/<provider> into the roots beneath it, so which directories
  # are roots stays defined in one place. byoc is the standalone
  # langsmith-byoc-role IAM root, nested a level deeper than the others.
  check:
    name: check (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, byoc, gcp]
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # ** rather than *: byoc's root sits one level deeper. Lock files are
          # gitignored repo-wide, so in practice versions.tf drives the key.
          key: tf-providers-${{ matrix.provider }}-${{ hashFiles(format('modules/{0}/**/.terraform.lock.hcl', matrix.provider), format('modules/{0}/**/versions.tf', matrix.provider)) }}
          restore-keys: |
            tf-providers-${{ matrix.provider }}-

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ hashFiles(format('modules/{0}/.tflint.hcl', matrix.provider)) }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # No args would sweep every provider in one job, so name this leg's
      # directory. check.sh expands it into the roots beneath it and exits 2 if
      # there are none, so a renamed directory fails the leg instead of passing
      # having checked nothing. Naming a directory means terraform only; the
      # scripts are the job below.
      - name: Run checks
        run: bash agents/check.sh "modules/${{ matrix.provider }}"

  # Plan tests, one job per provider for the same reasons as the legs above. Its
  # own job rather than a step inside check (<provider>): it plans the root
  # module, which is slower than validate and tflint put together, and a failing
  # assertion should read as a wiring failure rather than as a lint failure.
  # The matrix mirrors the check legs, byoc included: plan-tests.sh skips it by
  # name because it has no infra/ root to plan, and a leg that says so beats a
  # missing check nobody can account for. ocp is out of both matrices, having no
  # versions.tf to init against at all.
  plan-tests:
    name: plan tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, byoc, gcp]
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Shared with the check leg above by key, so whichever job runs first
      # populates it and the other reads it.
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ matrix.provider }}-${{ hashFiles(format('modules/{0}/**/.terraform.lock.hcl', matrix.provider), format('modules/{0}/**/versions.tf', matrix.provider)) }}
          restore-keys: |
            tf-providers-${{ matrix.provider }}-

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # No credentials and no backend: the suite mocks every provider, and
      # plan-tests.sh inits with -backend=false. A provider outside the skip
      # list with no tests/ directory exits 2 here rather than passing.
      - name: Run plan tests
        run: bash agents/plan-tests.sh "modules/${{ matrix.provider }}"

  # Every tracked script, one bar, whole repo -- including the ones outside the
  # provider trees (agents/, .github/scripts/, modules/ocp/). Its own job rather
  # than part of the legs above: it needs no terraform, so findings land in
  # seconds instead of behind an init, and a shell failure reads as a shell
  # failure rather than as check (aws).
  shellcheck-all:
    name: shellcheck (all scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than relying on the runner image: ubuntu-latest does ship
      # shellcheck, but an image bump could change its version and move the
      # findings under a gate that fails on warnings. Pin so the bar only
      # changes when we change it.
      - name: Setup shellcheck
        uses: ./.github/actions/setup-shellcheck

      - name: Shellcheck every tracked script
        run: bash agents/check.sh --scripts
