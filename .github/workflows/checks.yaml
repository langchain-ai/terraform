name: Terraform & Shell Checks

on:
  pull_request:
    paths:
      - "modules/**"
      - "agents/**"
      - ".github/scripts/**"
      - ".github/actions/setup-shellcheck/**"
      - ".github/workflows/checks.yaml"
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "agents/**"
      - ".github/scripts/**"
      - ".github/actions/setup-shellcheck/**"
      - ".github/workflows/checks.yaml"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The provider list is derived from the roots check.sh finds, not written out
  # here. Listing them by hand is the one drift that fails quietly: add a root
  # under a directory no leg claims and it goes unchecked while every job stays
  # green. Deriving it means a new root always gets a leg.
  providers:
    name: discover providers
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive the provider list from check.sh
        id: discover
        run: |
          set -euo pipefail
          roots=$(bash agents/check.sh --list-roots)
          if [ -z "$roots" ]; then
            echo "check.sh --list-roots returned nothing, so this workflow would" >&2
            echo "have checked no terraform at all. Every versions.tf is missing," >&2
            echo "or the root discovery in agents/check.sh is broken." >&2
            exit 1
          fi
          printf 'roots found:\n%s\n' "$roots"
          list=$(printf '%s\n' "$roots" | cut -d/ -f2 | sort -u \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "providers: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # One job per provider so a failure names the provider, and so the provider
  # rulesets install in parallel. Each covers that provider's roots and its shell
  # scripts. byoc is the standalone langsmith-byoc-role IAM root -- no shell
  # scripts, one root nested a level deeper than the others.
  check:
    name: check (${{ matrix.provider }})
    needs: providers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.providers.outputs.list) }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      # Pinned rather than relying on the runner image: ubuntu-latest does ship
      # shellcheck, but an image bump could change its version and move the
      # findings under a gate that fails on warnings. Pin so the bar only
      # changes when we change it.
      - name: Setup shellcheck
        uses: ./.github/actions/setup-shellcheck

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # ** rather than *: byoc's root sits one level deeper. Lock files are
          # gitignored repo-wide, so in practice versions.tf drives the key.
          key: tf-providers-${{ matrix.provider }}-${{ hashFiles(format('modules/{0}/**/.terraform.lock.hcl', matrix.provider), format('modules/{0}/**/versions.tf', matrix.provider)) }}
          restore-keys: |
            tf-providers-${{ matrix.provider }}-

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ hashFiles(format('modules/{0}/.tflint.hcl', matrix.provider)) }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # No args to check.sh would sweep every provider in one job, so scope the
      # matrix leg by filtering the script's own root list. check.sh --list-roots
      # is the single source of the discovery rule -- root depth varies and two
      # child modules carry a versions.tf, so a glob here would drift from it.
      - name: Run checks
        run: |
          set -euo pipefail
          roots=()
          while IFS= read -r r; do
            roots+=("$r")
          done < <(bash agents/check.sh --list-roots | grep "^modules/${{ matrix.provider }}/")
          printf 'roots: %s\n' "${roots[*]}"
          bash agents/check.sh "${roots[@]}"

  # check.sh scopes shellcheck to providers that have a terraform root, so
  # anything outside those trees gets no cover from the legs above: agents/,
  # .github/scripts/, and modules/ocp/ (stubs, no versions.tf). Lint every
  # tracked script here at the same bar, so a new script is gated wherever it
  # lands rather than only in the directories we thought to name.
  shellcheck-all:
    name: shellcheck (all scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup shellcheck
        uses: ./.github/actions/setup-shellcheck

      # Same bar check.sh applies to the provider scripts.
      - name: Shellcheck every tracked script
        run: |
          set -euo pipefail
          count=$(git ls-files '*.sh' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "no *.sh tracked in git, so this job checked nothing" >&2
            exit 1
          fi
          echo "linting $count tracked script(s) at -S warning"
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
