name: Setup shellcheck
description: Install a pinned, checksum-verified shellcheck release so the lint bar is reproducible.

runs:
  using: composite
  steps:
    # Version and digest are literals here rather than inputs: there is one call
    # site and it has never overridden them, and the two have to move together
    # anyway. Keep the version in step with what contributors run locally -- a
    # mismatch means a locally-clean tree can still fail CI on rules the other
    # version added.
    #
    # The digest is the release asset's sha256 as published by the GitHub
    # releases API (gh api repos/koalaman/shellcheck/releases/tags/v0.11.0 --jq
    # '.assets[].digest'). Without the check, a replaced tarball at that URL
    # would install and silently redefine the bar the gate enforces.
    - name: Install shellcheck 0.11.0
      shell: bash
      env:
        SHELLCHECK_VERSION: "0.11.0"
        SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      run: |
        set -euo pipefail
        if command -v shellcheck >/dev/null 2>&1 \
           && shellcheck --version | grep -qx "version: $SHELLCHECK_VERSION"; then
          echo "shellcheck $SHELLCHECK_VERSION already present"
          exit 0
        fi
        tmp=$(mktemp -d)
        url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$tmp/sc.tar.xz"
        got=$(sha256sum "$tmp/sc.tar.xz" | cut -d' ' -f1)
        if [ "$got" != "$SHELLCHECK_SHA256" ]; then
          echo "shellcheck tarball does not match its pinned sha256:" >&2
          echo "  url      $url" >&2
          echo "  expected $SHELLCHECK_SHA256" >&2
          echo "  got      $got" >&2
          exit 1
        fi
        tar -xJf "$tmp/sc.tar.xz" -C "$tmp"
        sudo install -m 0755 "$tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        rm -rf "$tmp"
        shellcheck --version
