# Numbers the public docs publish, each with the exact text that states it. `langsmith-sizing
# check-citations` fails when a quote is no longer in its file at the commit below; with `--ref main`
# it says whether the docs moved since. Update the commit only after re-reading every citation.
repo: langchain-ai/docs
commit: 96a94d110402cbda3f5dcf0ae40c94470c77026f
citations:
  blob_storage.required_from:
