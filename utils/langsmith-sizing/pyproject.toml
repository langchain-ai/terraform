[project]
name = "langsmith-sizing"
version = "0.1.0"
description = "Size and autoscale a self-hosted LangSmith install from its load: the canonical sizing for these modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "rich==15.0.0",
]

[project.scripts]
langsmith-sizing = "langsmith_sizing.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langsmith_sizing"]

[tool.uv]
# Older uv versions trust the compromised eMudhra CA chain during package downloads.
required-version = ">=0.13.4"

[dependency-groups]
# Pinned releases at least two weeks old when chosen; CI runs the gates with `--group dev`.
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261030",
]
