why: "The modules' production profile: the scale guide's Medium read and write load, serving real traffic and surviving the loss of a node."
inputs:
  users: 20
  peak_traces_per_second: 100
  traces_per_second: 33
  runs_per_trace: 10
  postgres: external
  redis: external
  smithdb_metastore: external
  object_store: external
  trace_store: smithdb
  survives_node_loss: true
notes:
  users: "The scale guide's Medium read load, about 20 users."
  peak_traces_per_second: "The scale guide's Medium write load, up to 100 traces a second."
  traces_per_second: "The busiest rate over the default peak factor of 3."
  runs_per_trace: "The model's default of 10 runs a trace, stated so the plan does not move if the default does."
  trace_store: "SmithDB alone: ClickHouse is the deprecated store and is sized only while a migration runs."
  redis: "A managed Redis, as the module's profile assumes."
  postgres: "A managed Postgres, as the module's profile assumes."
  smithdb_metastore: "A managed Postgres of its own, sized by the SmithDB tier."
  object_store: "A bucket, as the module's profile assumes."
  survives_node_loss: "Serving pods keep at least two replicas, so losing a node does not stop the install."
