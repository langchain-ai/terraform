[project]
name = "langsmith-load-test"
version = "0.1.0"
description = "Synthetic trace ingestion load testing for LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.2",
    "langchain-core==1.6.4",
    "langgraph==1.2.12",
    "langsmith==0.14.0",
    "python-dotenv==1.2.3",
    "structlog==26.1.0",
]

[project.scripts]
load-test = "loadtest.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadtest"]
