[project]
name = "langsmith-load-test"
version = "0.1.0"
description = "Verify a LangSmith sizing plan: send the load it was sized for, read it back, and measure lag and loss."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langsmith==0.14.0",
    "langsmith-sizing",
    "python-dotenv==1.2.3",
    "rich==15.0.0",
    "structlog==26.1.0",
]

[project.scripts]
load-test = "loadtest.cli:main"
load-test-plot = "loadtest.plot:main"

[tool.uv.sources]
langsmith-sizing = { path = "../langsmith-sizing", editable = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadtest"]

[tool.uv]
# Older uv versions trust the compromised eMudhra CA chain during package downloads.
required-version = ">=0.13.4"

[dependency-groups]
# The same pins as langsmith-sizing's dev group; CI runs the gates with `--group dev`.
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261030",
]
