# SmithDB overlay for LangSmith self-hosted on GCP (chart 0.16+).
#
# SmithDB is the in-chart columnar store/query engine that runs alongside
# ClickHouse. It shares the LangSmith namespace and release; it cannot run in a
# separate namespace or cluster.
#
# init-values.sh copies this to ../langsmith-values-smithdb.yaml when
# enable_smithdb = true, and generates ../langsmith-values-smithdb-overrides.yaml
# with the environment-specific bits (bucket name, Workload Identity service
# account annotation, metastore host/secret mapping) and the staged rollout gates
# from the infra outputs.
#
# This file only carries scheduling that differs from the chart defaults. Sizing
# comes from the chart; override resources here only if a specific environment
# needs it, and re-check the Local SSD pool has room for the new totals.

smithdb:
  enabled: true

  config:
    # Metastore credentials come from the Terraform-created Kubernetes secret.
    # The per-field key mapping and the object-store bucket are injected by
    # langsmith-values-smithdb-overrides.yaml (generated from infra outputs).
    existingSecretName: "smithdb-metastore"
    objectStore:
      # GCS access is via Workload Identity only. The chart's GCS path renders
      # just __OBJECT_STORE__GCS__BUCKET and __ROOT_FOLDER — there are no
      # credential fields, so no HMAC keys are needed or possible here.
      type: "gcs"

  # Two different migration workloads exist and they need opposite treatment.
  #
  # smithdb.metastoreMigration is a transient Helm pre-install hook. It is NOT
  # pinned below, deliberately: the hook runs before any SmithDB component pod
  # exists, so the cluster autoscaler has no pending pod to trigger scale-up from
  # zero, and pinning it to a tainted pool would leave it unscheduled until it hits
  # its deadline. The core pool always has running nodes, so it belongs there.
  #
  # Its resources are set explicitly because the chart defaults them to {}, and the
  # namespace ResourceQuota from modules/k8s-bootstrap constrains requests and
  # limits for cpu and memory. Once a quota covers those dimensions, Kubernetes
  # rejects any pod that omits them, so the Job would fail admission with no pod
  # ever created. The values are modest - this only runs Alembic against the
  # metastore.
  metastoreMigration:
    job:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  #
  # smithdb.migration is the one-shot ClickHouse backfill Job, gated behind
  # smithdb_migration_enabled. It is a normal resource rather than a hook, and it
  # only runs once ingestion is live, so the autoscaler reasoning above does not
  # apply. It IS pinned, below, because it requests 8 CPU / 16Gi / 100Gi ephemeral
  # storage — more than a core node can offer, and exactly what the Local SSD pool
  # is built for.

  # query, ingestion, and compactionWorker run on the Local SSD pool.
  # compaction and clusterManager run on the compute pool. The nodeSelectors and
  # tolerations match the labels/taints set by modules/smithdb-nodes, and use the
  # same keys as the AWS Karpenter NodePools so this overlay stays portable.
  query:
    deployment:
      # This emptyDir is what consumes Local SSD capacity. It only lands on SSD
      # because the node pool uses GKE's Local SSD-backed *ephemeral storage*
      # mode; with raw block Local SSD it would silently fall back to the boot
      # disk and cache I/O would be slow.
      volumes:
        - name: local-ssd-storage
          emptyDir:
            sizeLimit: 200Gi
      volumeMounts:
        - name: local-ssd-storage
          mountPath: /data
      nodeSelector:
        smithdb-local/instance-store: "true"
      tolerations:
        - key: smithdb-local/instance-store
          operator: Equal
          value: "true"
          effect: NoSchedule

  ingestion:
    deployment:
      nodeSelector:
        smithdb-local/instance-store: "true"
      tolerations:
        - key: smithdb-local/instance-store
          operator: Equal
          value: "true"
          effect: NoSchedule

  compactionWorker:
    deployment:
      nodeSelector:
        smithdb-local/instance-store: "true"
      tolerations:
        - key: smithdb-local/instance-store
          operator: Equal
          value: "true"
          effect: NoSchedule

  # The backfill Job requests 8 CPU, and the three cache workloads above already
  # request 12 of an n2-standard-16's ~15.9 allocatable, so the autoscaler adds a
  # second Local SSD node for the Job rather than co-locating it. That node drains
  # back to zero once the Job completes, so keep instance_store_max_nodes at 2 or
  # more while the migration gate is on.
  migration:
    deployment:
      nodeSelector:
        smithdb-local/instance-store: "true"
      tolerations:
        - key: smithdb-local/instance-store
          operator: Equal
          value: "true"
          effect: NoSchedule

  compaction:
    deployment:
      nodeSelector:
        smithdb-local/compute: "true"
      tolerations:
        - key: smithdb-local/compute
          operator: Equal
          value: "true"
          effect: NoSchedule

  clusterManager:
    deployment:
      nodeSelector:
        smithdb-local/compute: "true"
      tolerations:
        - key: smithdb-local/compute
          operator: Equal
          value: "true"
          effect: NoSchedule
