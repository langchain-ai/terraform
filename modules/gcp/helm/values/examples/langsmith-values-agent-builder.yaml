# Agent Builder — visual agent building UI (requires Deployments).
#
# init-values.sh merges this file into ../langsmith-values-overrides.yaml when
# enable_agent_builder = true. Put your changes in ../langsmith-values-local.yaml.
#
# Prerequisites:
#   - Agent Builder / LangGraph Platform entitlement in your LangSmith license
#   - Sufficient cluster resources (Agent Builder runs additional workloads)

config:
  agentBuilder:
    enabled: true
    # encryptionKey is read from the langsmith-config Secret
    # (agent_builder_encryption_key), which deploy.sh writes from
    # TF_VAR_langsmith_agent_builder_encryption_key. Do not set it here. Rotating
    # this key requires re-encrypting all existing Agent Builder configurations.

fleetToolServer:
  enabled: true

fleetTriggerServer:
  enabled: true
