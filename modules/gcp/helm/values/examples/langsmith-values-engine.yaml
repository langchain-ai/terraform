# Engine (chart v0.17+). See ENGINE.md.
#
# This file is auto-generated by init-values.sh when enable_engine = true in
# terraform.tfvars. Engine finds recurring failures in your traces, diagnoses them
# against your code, and proposes fixes. Every Engine run executes in a sandbox.
#
# Prerequisites:
#   - chart >= 0.17.0 (your own model providers need 0.17)
#   - Engine entitlement in your LangSmith license
#   - enable_sandboxes = true
#   - config.hostname reachable from the sandbox network, served with TLS
#   - TF_VAR_langsmith_engine_encryption_key and
#     TF_VAR_langsmith_engine_usage_signing_secret set (see infra/scripts/setup-env.sh)
#
# Engine and standalone Insights run from one image on one deployment
# (engineInsightsAgent). This file carries the same database wiring and sizing as
# langsmith-values-standalone-insights.yaml, so Engine runs without Insights; the
# two files compose when both are on. terraform apply creates the database and the
# two Secrets below when enable_engine or enable_standalone_insights is true.
#
# Keys, workload identity, and the optional sandbox workspace and LangSmith
# Intelligence URL are written by init-values.sh into
# helm/values/values-overrides.yaml (gitignored). Do not add them here.
engine:
  enabled: true

engineInsightsAgent:
  namePrefix: "standalone-insights"
  # Resources required: the langsmith-quota ResourceQuota in this namespace rejects
  # any pod without cpu/memory requests and limits.
  apiServer:
    deployment:
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
  queue:
    deployment:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi

  postgres:
    external:
      enabled: true
      # Secret created by Terraform (infra/main.tf: kubernetes_secret.standalone_insights_postgres).
      existingSecretName: "langsmith-insights-postgres"

  redis:
    external:
      enabled: true
      # Secret created by Terraform (infra/main.tf: kubernetes_secret.standalone_insights_redis).
      existingSecretName: "langsmith-insights-redis"
