# Insights — ClickHouse-backed analytics.
#
# init-values.sh merges this file into ../langsmith-values-overrides.yaml when
# enable_insights = true. Put your changes in ../langsmith-values-local.yaml.
#
# This overlay only turns the feature on. Where ClickHouse lives is a separate
# decision, made by clickhouse_source in terraform.tfvars:
#
#   clickhouse_source = "in-cluster"                    → the chart runs ClickHouse as a StatefulSet
#   clickhouse_source = "langsmith-managed" or "external" → init-values.sh points the chart at
#                                                         the langsmith-clickhouse Secret
#
# For an external ClickHouse, init-values.sh asks for the connection details
# while the langsmith-clickhouse Secret does not exist, and creates it. The chart
# reads every connection field from that Secret through secretKeyRef, so all
# seven keys must be present:
#
#   clickhouse_host  clickhouse_port  clickhouse_native_port  clickhouse_user
#   clickhouse_password  clickhouse_db  clickhouse_tls
#
# Chart 0.15.1 removed the bundled config.insights path and its validator hard-fails
# on the mere presence of the key (hasKey), even when set to false. The top-level
# insights block is the only supported path. Workload settings (scaling, databases,
# resources) live in engineInsightsAgent — see langsmith-values-standalone-insights.yaml.
insights:
  enabled: true
  # encryptionKey is read from the langsmith-config Secret (insights_encryption_key),
  # which deploy.sh writes from Secret Manager. Do not set it here.
  # Rotating this key requires re-encrypting all existing Insights data.
