# ============================================================================
# WARNING: NOT FOR PRODUCTION USE
#
# Resource profile for non-production environments: local dev, CI pipelines,
# integration tests, demos, and short-lived POCs. Single replica per
# component, no autoscaling, but enough headroom for a developer to actually
# use the system — run traces, test agents, use the playground without
# hitting OOM kills every five minutes.
#
# For cost parking / idle standby: use langsmith-values-sizing-minimum.yaml
# For production: use langsmith-values-sizing-production.yaml
#   (sizing_profile = "production" in terraform.tfvars)
# ============================================================================
#
# Why this exists:
#   Chart defaults request 1+ CPU per component and 3.5 CPU / 12Gi for
#   ClickHouse alone. A base LangSmith install won't schedule on anything
#   smaller than ~12 vCPU without this overlay.
#
# Why the memory floors are what they are:
#   The application images import the full LangChain stack plus ddtrace at
#   startup, which costs 450-600Mi of RSS before the process serves a single
#   request. A limit below that floor does not degrade the component, it
#   CrashLoopBackOffs it — the container is OOMKilled during import and never
#   reaches its readiness probe. Keep these limits at or above 1Gi for any
#   Python application component, however idle the environment is.
#
# Covers ALL chart components including infrastructure (ClickHouse, operator,
# agent-builder servers) — not just the application pods.
#
# Kept deliberately in step with the AWS and Azure dev profiles. Divergence
# here is what produced the GCP-only playground/listener/fleet-tool-server
# OOM crashloops on chart 0.16.

# -- Application components ----------------------------------------------------

backend:
  e2eTest:
    enabled: false
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

frontend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

platformBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

playground:
  deployment:
    replicas: 1
    # Memory tracks the chart default request of 1Gi. The 0.16 playground image
    # needs well over 384Mi just to start, and the HPA on this deployment scales
    # on memory at 80% of requests, so an undersized request both OOM-kills the
    # container and drives it straight to maxReplicas while every pod crashloops.
    resources:
      requests:
        cpu: "100m"
        memory: "1Gi"
      limits:
        cpu: "500m"
        memory: "2Gi"

queue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

ingestQueue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

aceBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- Deployments feature components --------------------------------------------

hostBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

listener:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

operator:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- Agent Builder infrastructure ----------------------------------------------

fleetToolServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

fleetTriggerServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- In-cluster data services (Tier 1 only) -----------------------------------
# These apply when using in-cluster postgres, redis, and clickhouse.
# If pointing at managed services (Cloud SQL, Memorystore, ClickHouse Cloud),
# these blocks are ignored — the StatefulSets won't be created.
#
# GCP storage class: premium-rwo (zonal SSD) is the default for StatefulSets.
# Chart default for ClickHouse is 3.5 CPU / 12Gi — oversized for dev, but the
# 512Mi/1.5Gi this file used to carry is under what a single ClickHouse pod
# holds at idle once traces start landing.

postgres:
  statefulSet:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

redis:
  statefulSet:
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

clickhouse:
  statefulSet:
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
