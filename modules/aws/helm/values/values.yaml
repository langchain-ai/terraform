# AWS base Helm values for LangSmith.
#
# Applied on every deploy, by BOTH deploy paths:
#   helm/scripts/deploy.sh  (shell)      loads this as the base values file
#   app/main.tf             (Terraform)  loads this as the base values file
#
# Holds the AWS-native defaults that do not vary per deployment: ALB ingress, gp3
# storage, S3 blob storage, and ESO-backed secrets. Everything that varies per
# install layers on top, last value wins:
#   1. values.yaml                                     this file (tracked)
#   2. langsmith-values-overrides.yaml                 generated per install (gitignored)
#   3. overlays/langsmith-values-sizing-<profile>.yaml
#   4. overlays/langsmith-values-<addon>.yaml
#
# Do NOT put secrets or per-install values here. Hostname, IRSA role ARN, bucket
# name, and admin email are generated into the overrides file by init-values.sh.

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # scheme, group.name, and load-balancer-arn are set in langsmith-values-overrides.yaml
    # (auto-generated by init-values.sh). Do not hardcode them here — the overrides
    # file is the single source of truth for ALB binding.
    # For HTTPS (ACM): update listen-ports and add the certificate ARN:
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #   alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:<region>:<account>:certificate/<id>"
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"

# ── Config ────────────────────────────────────────────────────────────────────
config:
  authType: "mixed"
  # Secrets are managed by External Secrets Operator (ESO) — not stored in this file.
  # ESO syncs the 'langsmith-config' K8s Secret from SSM prefix:
  #   /langsmith/{name_prefix}-{environment}/
  #
  # Auto-created by setup-env.sh (run before deploy):
  #   langsmith-license-key       → langsmith_license_key
  #   langsmith-api-key-salt      → api_key_salt
  #   langsmith-jwt-secret        → jwt_secret
  #   langsmith-admin-password    → initial_org_admin_password
  #
  # Required manually before enabling addons (see each overlay for instructions):
  #   agent-builder-encryption-key  → agent_builder_encryption_key  (agent-builder addon)
  #   insights-encryption-key       → insights_encryption_key        (insights addon)
  existingSecretName: "langsmith-config"

  basicAuth:
    enabled: true   # must be false when SSO is enabled (see below)
    # IMPORTANT: jwtSecret must be at config.basicAuth.jwtSecret — NOT config.jwtSecret.
    # Placing it at the top level of config silently passes Helm validation but does not
    # wire correctly. The value is injected via existingSecretName as the 'jwt_secret' key.

  # ── SSO (OAuth2.0 / OIDC) ───────────────────────────────────────────────────
  # Commented out by default. Enterprise plan only, and https only.
  # Setup guide (IdP app registration, callback URL, per-provider steps, and the
  # rules on migrating between auth modes):
  #   https://docs.langchain.com/langsmith/self-host-sso
  #
  # basicAuth and oauth cannot both be enabled. Set basicAuth.enabled to false
  # above when you uncomment the oauth block.
  #
  # The client id, client secret, and issuer URL do NOT go in this file. Because
  # existingSecretName is set above, the chart skips its own secret template and
  # reads them out of langsmith-config under the keys oauth_client_id,
  # oauth_client_secret, and oauth_issuer_url. They are mounted with
  # optional: false, so a missing key leaves the pods in CreateContainerConfigError.
  # apply-eso.sh already syncs all three once the SSM parameters exist, so create
  # them under the same prefix as above and re-run the deploy:
  #   /langsmith/{name_prefix}-{environment}/oauth-client-id
  #   /langsmith/{name_prefix}-{environment}/oauth-client-secret
  #   /langsmith/{name_prefix}-{environment}/oauth-issuer-url
  #
  # oauth:
  #   enabled: true
  #   oauthScopes: "email,profile,openid"  # add ",groups" only if your IdP needs it for SSO group sync
  #   oauthSessionMaxSec: "86400"          # 24h session cap; max 604800
  #   # urlEncodeScopeSpaces: true         # only for IdPs that reject "+"-encoded scope lists (e.g. SiteMinder)

  blobStorage:
    enabled: true
    engine: "S3"
    # bucketName and the IRSA service-account annotation are set in the overrides file.

# ── Postgres ──────────────────────────────────────────────────────────────────
# Secret "langsmith-postgres" is created by the k8s-bootstrap Terraform module.
postgres:
  external:
    enabled: true
    existingSecretName: "langsmith-postgres"
    connectionUrlSecretKey: "connection_url"

# ── Redis ─────────────────────────────────────────────────────────────────────
# Secret "langsmith-redis" is created by the k8s-bootstrap Terraform module.
redis:
  external:
    enabled: true
    existingSecretName: "langsmith-redis"
    connectionUrlSecretKey: "connection_url"

# ── ClickHouse ────────────────────────────────────────────────────────────────
# Defaults to in-cluster with a persistent volume. When clickhouse_source is
# "langsmith-managed" or "external", the insights overlay sets external.enabled
# to true instead.
#
# The storage class belongs on each stateful component. A top-level
# `storage.storageClassName` is NOT a chart value: it renders without error and is
# silently ignored, which is why gp3 is set here instead. Postgres and Redis are
# external on AWS, so ClickHouse is the only component that claims a volume.
clickhouse:
  external:
    enabled: false
  statefulSet:
    persistence:
      enabled: true
      storageClassName: gp3

# ── Add-on features ───────────────────────────────────────────────────────────
# The chart defaults insights.enabled and polly.enabled to TRUE. Left alone that
# adds eight workloads to every install — each feature gets an api-server, a queue,
# and its own in-cluster Postgres and Redis StatefulSet, each claiming a volume.
# Both deploy paths load this file first and the add-on overlays last, so turning
# the features off here leaves the overlay as the only thing that switches one on.
# fleet.enabled already defaults to false, so it needs no entry.
insights:
  enabled: false
polly:
  enabled: false
