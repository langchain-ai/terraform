# ============================================================================
# WARNING: NOT FOR PRODUCTION USE
#
# Resource profile for non-production environments: local dev, CI pipelines,
# integration tests (k3d/kind/EKS dev), demos, and short-lived POCs.
# Single-replica baselines with HPA/KEDA autoscaling and enough headroom for a developer to use the system. Add-ons retain their own autoscaling policies.
#
# For cost parking / idle standby: use langsmith-values-sizing-minimum.yaml
# For production: use langsmith-values-sizing-production.yaml
#   (sizing_profile = "production" in terraform.tfvars)
# ============================================================================
#
# Why this exists:
#   Chart defaults request 1+ CPU per component and 3.5 CPU / 12Gi for
#   ClickHouse alone. A base LangSmith install won't schedule on anything
#   smaller than ~12 vCPU without this overlay. For CI or dev clusters
#   running on 2-4 vCPU nodes, you need these reduced requests or pods
#   stay Pending indefinitely.
#
# Covers core services and shared infrastructure. Fleet, Chat, and Insights
# service resources come from their separate add-on overlays.
#
# NOTE: Uses deployment.resources / deployment.replicas nesting to match the
# current LangSmith chart schema (aligned with GCP and Azure values).

# -- Application components ----------------------------------------------------

backend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  e2eTest:
    enabled: false
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

frontend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

platformBackend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

playground:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

queue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
  autoscaling:
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 5
      # Idle memory is close to the request and does not fall as replicas are
      # added, so the chart's 80% target would hold extra replicas at idle.
      targetMemoryUtilizationPercentage: 150

ingestQueue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
  autoscaling:
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 5

aceBackend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- Deployments feature components --------------------------------------------

hostBackend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        # 512Mi was below host-backend's idle footprint (~455Mi), so the default
        # memory-based HPA (target 80%) pinned it to maxReplicas. 1Gi keeps idle
        # utilization ~45% so it settles at 1 replica.
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

listener:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

operator:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- Fleet infrastructure ------------------------------------------------------

fleetToolServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

fleetTriggerServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# -- Operator-managed agent resources ------------------------------------------
# Removed: chart 0.15.1+ dropped the bundled operator-managed agent path and its
# validator hard-fails on the presence of config.polly / config.insights (even
# when only sizing their nested agent.resources). Standalone Fleet/Polly/Insights
# are sized via the top-level apiServer/queue resources in their own overlays
# (langsmith-values-fleet.yaml, -standalone-polly.yaml, -standalone-insights.yaml).

# -- SmithDB ---------------------------------------------------------------
# No profile sizes SmithDB. Every profile runs the small tier that
# langsmith-values-smithdb.yaml sets, with the chart's replica defaults and the
# compaction-worker KEDA range from langsmith-values.yaml. For the medium or
# large tier, see SMITHDB.md, "Scaling up".

# -- In-cluster data services (Tier 1 only) -----------------------------------
# These apply when using in-cluster clickhouse.
# If you're pointing at managed services (RDS, ElastiCache, ClickHouse Cloud),
# these blocks are ignored — the StatefulSets won't be created.
#
# Chart default for ClickHouse is 3.5 CPU / 12Gi — wildly oversized for dev.

clickhouse:
  statefulSet:
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
