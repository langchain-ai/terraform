# Istio Gateway alternative.
# Terraform installs Istio and binds its ClusterIP ingress Service to the ALB
# target group. The Istio gateway Service stays internal. init-values.sh generates these settings
# in the environment overrides when enable_istio_gateway = true.
#
# Client → Terraform ALB → Istio pods:80 → VirtualService → frontend or agents.
# ACM terminates TLS at the ALB; the DNS-01 path can terminate TLS at Istio.
# Use alb_dns_name or langsmith_domain, rather than a gateway Service hostname.

ingress:
  enabled: false

gateway:
  enabled: false

# Istio VirtualService routing — chart creates a VirtualService pointing to
# langsmith-frontend when istioGateway.enabled: true.
# name and namespace match the Gateway resource installed by k8s-bootstrap.
istioGateway:
  enabled: true
  name: "langsmith-gateway"
  namespace: "langsmith"            # namespace where the Gateway resource lives
                                    # NOT the namespace of the istio-ingressgateway pod
