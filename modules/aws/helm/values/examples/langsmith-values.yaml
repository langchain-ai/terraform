# AWS base Helm values for LangSmith.
#
# init-values.sh copies this to ../langsmith-values.yaml on first run.
# Manual: cp examples/langsmith-values.yaml ../langsmith-values.yaml
#
# Applied on every deploy alongside langsmith-values-overrides.yaml.
# It configures AWS-native integrations: ALB ingress, gp3 storage, S3 blob storage,
# and ESO-backed secret management.
#
# Do NOT put secrets here. Secrets are managed by External Secrets Operator (ESO),
# which syncs them from SSM into the 'langsmith-config' K8s Secret automatically.
#
# For environment-specific overrides (hostname, IRSA role ARN, bucket name, admin
# email), see langsmith-values-{env}.yaml — generated by init-values.sh.

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # scheme, group.name, and load-balancer-arn are set in langsmith-values-overrides.yaml
    # (auto-generated by init-values.sh). Do not hardcode them here — the overrides
    # file is the single source of truth for ALB binding.
    # For HTTPS (ACM): update listen-ports and add the certificate ARN:
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #   alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:<region>:<account>:certificate/<id>"
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"

storage:
  storageClassName: gp3

config:
  authType: "mixed"
  # Secrets are managed by External Secrets Operator (ESO) — not stored in this file.
  # ESO syncs the 'langsmith-config' K8s Secret from SSM prefix:
  #   /langsmith/{name_prefix}-{environment}/
  #
  # Auto-created by setup-env.sh (run before deploy):
  #   langsmith-license-key       → langsmith_license_key
  #   langsmith-api-key-salt      → api_key_salt
  #   langsmith-jwt-secret        → jwt_secret
  #   langsmith-admin-password    → initial_org_admin_password
  #   sandbox-callback-signing-jwk → sandbox_callback_signing_jwk (sandboxes)
  #   sandbox-service-auth-secret → sandbox_service_auth_secret  (external sandbox runtime)
  #   engine-encryption-key       → engine_encryption_key        (Engine)
  #   engine-usage-signing-secret → engine_usage_signing_secret  (Engine)
  #
  # Required manually before enabling addons (see each addon file for instructions):
  #   agent-builder-encryption-key  → agent_builder_encryption_key  (Fleet; historical names retained)
  #   insights-encryption-key       → insights_encryption_key        (insights addon)
  existingSecretName: "langsmith-config"
  basicAuth:
    enabled: true
    # IMPORTANT: jwtSecret must be at config.basicAuth.jwtSecret — NOT config.jwtSecret.
    # Placing it at the top level of config silently passes Helm validation but does not
    # wire correctly. The value is injected via existingSecretName as the 'jwt_secret' key.
  blobStorage:
    enabled: true
    engine: "S3"
  settings:
    # Medium reads, medium writes (see the sizing note below).
    redisRunsExpirySeconds: "3600"

postgres:
  external:
    enabled: true
    existingSecretName: "langsmith-postgres"
    connectionUrlSecretKey: "connection_url"

redis:
  external:
    enabled: true
    existingSecretName: "langsmith-redis"
    connectionUrlSecretKey: "connection_url"

# Sizing. Every install runs the scale guide's medium reads, medium writes pattern
# (about 20 concurrent users and 100 traces per second) and the SmithDB small tier:
#   https://docs.langchain.com/langsmith/self-host-scale#medium-reads-medium-writes
#   https://docs.langchain.com/langsmith/self-host-smithdb-scale
# Requests and limits stay at the chart's defaults, and the pattern's 13 GiB of
# Redis is the default ElastiCache node, cache.m6g.xlarge. In-cluster ClickHouse
# keeps the chart's 3.5 CPU, 12 GiB and 50 GiB volume, below the pattern's: with
# SmithDB serving reads it mostly takes writes, and
# helm/values/examples/SIZING.md says how to grow its volume. Size beyond this
# pattern here.
frontend:
  deployment:
    replicas: 2

backend:
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 8
      maxReplicas: 16

# Terraform installs KEDA on every install (k8s-bootstrap), and KEDA scales the
# queues on their backlog, CPU, and memory. The chart allows one scaler per
# service, so the compaction worker's HPA is off.
queue:
  autoscaling:
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10

ingestQueue:
  autoscaling:
    keda:
      enabled: true
      minReplicaCount: 3
      maxReplicaCount: 6

smithdb:
  compactionWorker:
    autoscaling:
      hpa:
        enabled: false
      keda:
        enabled: true
        minReplicaCount: 1
        maxReplicaCount: 10
