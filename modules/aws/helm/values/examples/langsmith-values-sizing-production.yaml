# Production sizing — multi-replica deployments with HPA autoscaling.
#
# This is the recommended profile for any environment serving real traffic.
# Enables horizontal pod autoscaling on the core stateless components with
# reasonable resource requests as starting points. Tune to your workload:
#   kubectl top pods -n langsmith
#
# Covers core services and shared infrastructure. Fleet, Chat, and Insights
# service resources and autoscaling come from their separate add-on overlays.

# -- Application components ----------------------------------------------------

platformBackend:
  deployment:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 50
      targetMemoryUtilizationPercentage: 80

