# Envoy Gateway (default and recommended).
# Terraform owns the ALB, ACM listeners, and target group. k8s-bootstrap installs
# Envoy and binds its ClusterIP proxy Service to that target group.
# init-values.sh generates these settings in the environment overrides.
#
# Client → Terraform ALB → Envoy pods:10080 → HTTPRoute → frontend or agents.
# Use the Terraform alb_dns_name output or langsmith_domain for the hostname.
# Cross-namespace HTTPRoutes support split dataplane deployments.

ingress:
  enabled: false

# Gateway API routing — chart creates HTTPRoute pointing to langsmith-frontend.
# gateway.name and gateway.namespace must match the Gateway created by terraform apply.
# init-values.sh sets these automatically.
gateway:
  enabled: true
  name: "langsmith-gateway"
  namespace: "langsmith"
