# Polly — AI-powered evaluation and monitoring.
# Requires config.deployment.enabled = true (LangGraph Platform).
# Encryption key is stored in the langsmith-config K8s Secret (via ESO from SSM).
#
# Chart 0.15.1 removed the bundled config.polly path and its validator hard-fails on
# the mere presence of the key (hasKey), even when set to false. The top-level polly
# block below is the only supported path. External Postgres/Redis wiring for the Polly
# deployment lives in langsmith-values-standalone-polly.yaml; loading both is additive.
polly:
  enabled: true
  # Sizing mirrors the legacy config.polly.agent.resources defaults
  # (cpu 2/4, memory 4096/8192 MiB), split across the api-server and queue pods.
  apiServer:
    deployment:
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
  queue:
    deployment:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
