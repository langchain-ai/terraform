# LangSmith Chat (formerly Polly) — chat for traces, threads, prompts, and experiments.
# Runs as top-level services and does not require LangSmith Deployments.
# Encryption key is stored in the langsmith-config K8s Secret (via ESO from SSM).
#
# Chart 0.15.1 removed the bundled config.polly path and its validator hard-fails on
# the mere presence of the key (hasKey), even when set to false. The top-level polly
# block below is the only supported path. Chat uses the langsmith_polly database on the
# shared RDS and DB index 2 on the shared ElastiCache; init-values.sh writes that
# storage into langsmith-values-overrides.yaml and deploy.sh sets it on every deploy.
polly:
  enabled: true
  # Sizing mirrors the legacy config.polly.agent.resources defaults
  # (cpu 2/4, memory 4096/8192 MiB), split across the api-server and queue pods.
  apiServer:
    deployment:
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
  queue:
    deployment:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
