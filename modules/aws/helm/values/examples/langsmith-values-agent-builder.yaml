# Agent Builder — visual agent building UI (requires Deployments).
#
# init-values.sh copies this to ../langsmith-values-agent-builder.yaml when you choose
# a product tier that includes Agent Builder (tier 3+).
# Manual: cp examples/langsmith-values-agent-builder.yaml ../langsmith-values-agent-builder.yaml
#
# Prerequisites:
#   - Agent Builder / LangGraph Platform entitlement in your LangSmith license
#   - Sufficient cluster resources (Agent Builder runs additional workloads)

config:
  agentBuilder:
    enabled: true
    # encryptionKey is pulled from SSM via ESO — do not set it here.
    # Required SSM parameter: /langsmith/{prefix}-{env}/agent-builder-encryption-key
    # Generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    # Store:    aws ssm put-parameter --name "/langsmith/{prefix}-{env}/agent-builder-encryption-key" \
    #             --value "<key>" --type SecureString
    # deploy.sh adds this key to the langsmith-config ExternalSecret automatically.

# config.agentBuilder.agent.resources used to size the operator-managed agent pods,
# via the agent-bootstrap Job that registered them. Chart 0.16 removed that Job. The
# key survives in the chart's own defaults but no template reads it, so setting it
# here sizes nothing. Agent sizing now belongs to the standalone agent that owns the
# workload — see langsmith-values-fleet.yaml.
#
# For the same reason config.agentBuilder on its own gives you the UI nav item and
# the tool/trigger servers below with no agent runtime behind them. Fleet is the
# supported path: set enable_fleet = true instead of enable_agent_builder.

# Chart v0.15 renamed agentBuilderToolServer/agentBuilderTriggerServer to
# fleetToolServer/fleetTriggerServer. Both now run on the consolidated
# images.backendImage (chart 0.16.0-rc.17).
fleetToolServer:
  enabled: true

fleetTriggerServer:
  enabled: true
