# -- SmithDB ---------------------------------------------------------------

smithdb:
  query:
    deployment:
      resources:
        requests:
          cpu: "28"
          memory: "50Gi"
          ephemeral-storage: "1000Gi"
        limits:
          cpu: "28"
          memory: "50Gi"
          ephemeral-storage: "1000Gi"
      volumes:
        - name: local-ssd-storage
          emptyDir:
            sizeLimit: "1000Gi"
    autoscaling:
      minReplicas: 4

  ingestion:
    deployment:
      resources:
        requests:
          cpu: "56"
          memory: "150Gi"
          ephemeral-storage: "1000Gi"
        limits:
          cpu: "56"
          memory: "150Gi"
          ephemeral-storage: "1000Gi"
      volumes:
        - name: local-ssd-storage
          emptyDir:
            sizeLimit: "1000Gi"
    autoscaling:
      minReplicas: 2

  compaction:
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "16Gi"

  compactionWorker:
    deployment:
      resources:
        requests:
          cpu: "28"
          memory: "50Gi"
          ephemeral-storage: "300Gi"
        limits:
          cpu: "28"
          memory: "50Gi"
          ephemeral-storage: "300Gi"
      volumes:
        - name: local-ssd-storage
          emptyDir:
            sizeLimit: "300Gi"
    autoscaling:
      minReplicas: 4

  clusterManager:
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "2Gi"

# -- In-cluster ClickHouse (dev/POC only — production should use external) -----
# High/High pattern: 14+ CPU / 24+ Gi per node, 3-node cluster recommended.
# In-cluster ClickHouse is a single StatefulSet pod — it cannot do 3-node.
# If you're at this scale, you should be using LangChain Managed ClickHouse.
# These limits are set high to squeeze maximum performance from a single pod.

clickhouse:
  statefulSet:
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "32Gi"
