# SmithDB for AWS (chart 0.17+), in the LangSmith namespace and release.
# init-values.sh supplies storage, connection, node scheduling and cache StorageClass
# settings in the overrides file; deploy.sh applies the tier resources.

smithdb:
  enabled: true
  # The one place the tier is set, and the default SmithDB nodes fit small. For
  # medium or large, raise the node inputs in terraform.tfvars first (SMITHDB.md,
  # "Scaling up"). make deploy stops when the tier's largest pod does not fit a
  # SmithDB node.
  resourceTier: small
  config:
    existingSecretName: "smithdb-local"
