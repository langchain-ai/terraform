# Copied from modules/gcp/helm/values/examples; keep in step with it.
# Bare metal: the "Cloud SQL/Memorystore" notes below map to postgres-langsmith (database created by a Terraform Job) and redis-langsmith (logical DB index).
#
# Resources are not set here: Terraform writes them to langsmith-values-overrides.yaml from the
# same table the budget gate counts (feature_pod_sizes in infra/locals.tf), so the two can't drift.

# Fleet — v0.15 standalone counterpart to Agent Builder (chart v0.15+).
#
# Uses fleet.enabled (standalone path). Does NOT require enable_deployments = true.
# Do not combine with langsmith-values-agent-builder.yaml (legacy config.agentBuilder path).
#
# This file is auto-generated by init-values.sh when enable_fleet = true in
# terraform.tfvars. External postgres and redis are wired to the existing
# Cloud SQL and Memorystore instances provisioned by the infra pass.
#
# Prerequisites:
#   - chart >= 0.15.0
#   - Agent Builder / Fleet entitlement in your LangSmith license
#   - A 'fleet' database on Cloud SQL — provisioned automatically by terraform apply
#   - TF_VAR_langsmith_agent_builder_encryption_key set (see infra/scripts/setup-env.sh)
#     (shared with the legacy enable_agent_builder path — same key, same data)
#
# Enable via: enable_fleet = true in terraform.tfvars
# encryptionKey is injected automatically by init-values.sh.

# Disables the legacy config.agentBuilder path — overrides langsmith-values-agent-builder.yaml
# if both files are loaded in the same helm command.
config:
  agentBuilder:
    enabled: false

hostBackend:
  enabled: true

fleet:
  enabled: true
  namePrefix: "standalone-fleet"
  # encryptionKey is written by init-values.sh from TF_VAR_langsmith_agent_builder_encryption_key.
  # Shared with the legacy config.agentBuilder path — do not change once data exists.
  # encryptionKey: ""

  # The chart defaults these standalone blocks' resources to {} (BestEffort).
  # Terraform sets requests and limits for them in langsmith-values-overrides.yaml.
  apiServer:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  queue:
    enabled: true
  postgres:
    external:
      enabled: true
      # Secret created by Terraform (infra/main.tf: kubernetes_secret.fleet_postgres).
      # Contains key: postgres_connection_url = postgresql://<user>:<pass>@<host>:5432/fleet?sslmode=require
      existingSecretName: "langsmith-fleet-postgres"

  redis:
    external:
      enabled: true
      # Secret created by Terraform (infra/main.tf: kubernetes_secret.fleet_redis).
      # Contains key: redis_connection_url = redis://<host>:<port>
      existingSecretName: "langsmith-fleet-redis"

# fleetToolServer / fleetTriggerServer are separate top-level Deployments, not
# part of the fleet.* block above.
fleetToolServer:
  enabled: true
  # The fleet-tool-server image CPU-pegs on startup (LANGGRAPH_DEPLOYMENT_URL
  # sync/poll loop) and CrashLoopBackOffs on a 1-CPU limit, because uvicorn
  # cannot serve /health on port 1989 within the default probe window. It needs
  # >= 2 CPU and a relaxed startup probe; CPU settles below 20m afterwards.
  #
  # The failure does not look like CPU starvation from the outside. The uvicorn
  # parent binds the port and stays up, so the container is never OOMKilled and
  # never exits non-zero; the workers are reaped in a loop that logs only
  # "Child process [N] died" with no traceback, and the pod's lastState reads
  # Completed with exit code 0. Do not lower these values to fit a sizing
  # profile — this is the same constraint the AWS module carries. Terraform
  # keeps its CPU limit at 2 or more whatever the sizing profile.
  deployment:
    startupProbe:
      httpGet:
        path: /health
        port: 1989
      failureThreshold: 30
      periodSeconds: 5
      timeoutSeconds: 5

fleetTriggerServer:
  # Currently only supports a single replica (chart-enforced) to prevent
  # duplicate trigger executions — do not set a replica count here.
  enabled: true
