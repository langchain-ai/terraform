# Every credential from Secrets that already exist (a customer's secret store): no password given, none
# rendered, in both Redis paths' shape (the operator runtime with Sentinels).
runtime: operator
namespace: langsmith-data
existingSecrets: true
postgres:
  instances:
    langsmith: { databases: [langsmith_polly], replicas: 3 }
redis:
  instances:
    langsmith: { replicas: 3 }
