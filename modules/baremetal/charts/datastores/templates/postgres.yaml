{{- /*
One Postgres per instance, every object named postgres-<instance> so all instances can share one
namespace, reached in both runtimes at postgres-<instance>.<namespace>.svc.cluster.local:5432 by the
user and password given, so the Secrets LangSmith reads are the same whichever runs it.

statefulset: the official image (no Bitnami, no operator), adapted from the OCP reference minus its
OpenShift-only settings. The user the image creates is a superuser, which LangSmith's migrations rely
on to create their extensions (docs.langchain.com/langsmith/self-host-external-postgres, Requirements).

operator: a CloudNativePG Cluster (cloudnative-pg.io/documentation). The owner is made a superuser
through managed.roles for the same reason, and a managed Service named postgres-<instance> follows the
primary.
*/ -}}
{{- range $key, $pg := .Values.postgres.instances }}
{{- if $pg.enabled }}
{{- $ns := include "datastores.ns" (dict "root" $ "ns" $pg.namespace) }}
{{- $name := printf "postgres-%s" $key }}
{{- $secret := printf "%s-credentials" $name }}
{{- $password := "" }}
{{- if not $.Values.existingSecrets }}
{{- $password = required (printf "postgres.instances.%s.password is required" $key) $pg.password }}
{{- end }}
{{- $limitMi := include "datastores.mebibytes" $pg.resources.limits.memory | int }}
{{- /* The instance label, not app.kubernetes.io/name, tells instances in one namespace apart; it is
our own key so CloudNativePG's recommended labels on its pods never collide with it. */ -}}
{{- $selector := dict "langsmith.lab/datastore-instance" $name }}
{{- $labels := merge (dict "app.kubernetes.io/name" "postgres") $selector $.Values.datastoreLabel }}
{{- if eq $.Values.runtime "statefulset" }}
{{- if ne (int $pg.replicas) 1 }}
{{- fail (printf "postgres.instances.%s.replicas: runtime statefulset runs one Postgres; replicas need runtime operator" $key) }}
{{- end }}
{{- if not $.Values.existingSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $pg.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ $pg.database | quote }}
{{- end }}
---
# Headless: the StatefulSet gets a stable DNS name without load balancing.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      # Clean shutdown flushes WAL; give it time before SIGKILL.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          {{- include "datastores.antiAffinityTerms" $ | nindent 10 }}
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          # Postgres' own memory from the container limit: a quarter for shared_buffers, a half as
          # effective_cache_size, so it stays under the limit the kernel enforces.
          args:
            - -c
            - shared_buffers={{ div $limitMi 4 }}MB
            - -c
            - effective_cache_size={{ div $limitMi 2 }}MB
            - -c
            - max_connections={{ $pg.maxConnections }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          # Postgres 18 images keep data under /var/lib/postgresql/18/docker and expect the volume at
          # the parent; mounting .../data fails to start.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          # No liveness probe on purpose: it could kill Postgres during a long crash recovery. Startup
          # waits for first init; readiness gates traffic.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "datastores.claimSpec" (dict "root" $ "ns" $ns "name" $name "size" $pg.volumeSize) | nindent 8 }}
{{- if $pg.databases }}
{{- $dbs := sortAlpha $pg.databases | join "," }}
---
# One database per standalone product on the shared instance, as google_sql_database in modules/gcp.
# A Job stands in for the cloud API: it creates only those missing, so every run after the first is a
# no-op. Names reach SQL as a psql variable (:'dbs', quoted by psql), never pasted into the SQL text,
# and the schema holds them to ^[a-z_][a-z0-9_]*$. A hook, so it runs after Postgres is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-create-databases
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-create-databases
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      containers:
        - name: psql
          image: {{ $.Values.postgres.image }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -v dbs="$DATABASES" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', d, current_user)
              FROM unnest(string_to_array(:'dbs', ',')) AS d
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = d)
              \gexec
              SQL
              echo "databases present: $DATABASES"
          env:
            - name: PGHOST
              value: {{ $name }}.{{ $ns }}.svc.cluster.local
            - name: PGUSER
              value: {{ $pg.username | quote }}
            - name: PGDATABASE
              value: {{ $pg.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: POSTGRES_PASSWORD
            - name: DATABASES
              value: {{ $dbs | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
{{ include "datastores.pdb" (dict "name" $name "ns" $ns "labels" $labels "selector" $selector) }}
{{- else }}
{{- if not $.Values.existingSecrets }}
---
# CloudNativePG reads the owner's password from a basic-auth Secret, for initdb and managed.roles alike.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $ns }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $pg.username | quote }}
  password: {{ $password | quote }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  instances: {{ $pg.replicas }}
  imageName: {{ $.Values.postgres.operatorImage }}
  # The instance and datastore labels, so the client NetworkPolicy and the anti-affinity select these
  # pods as they do the StatefulSet's.
  inheritedMetadata:
    labels:
      {{- toYaml (merge (dict) $selector $.Values.datastoreLabel) | nindent 6 }}
  bootstrap:
    initdb:
      database: {{ $pg.database }}
      owner: {{ $pg.username }}
      secret:
        name: {{ $secret }}
  managed:
    roles:
      - name: {{ $pg.username }}
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: {{ $secret }}
    # The name the StatefulSet's Service has, on the primary: LangSmith's Secrets keep their host.
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ $name }}
  postgresql:
    parameters:
      shared_buffers: {{ printf "%dMB" (div $limitMi 4) | quote }}
      effective_cache_size: {{ printf "%dMB" (div $limitMi 2) | quote }}
      max_connections: {{ $pg.maxConnections | toString | quote }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  storage:
    storageClass: {{ $.Values.storageClass }}
    size: {{ $pg.volumeSize }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    additionalPodAntiAffinity:
      {{- include "datastores.antiAffinityTerms" $ | nindent 6 }}
{{- range sortAlpha $pg.databases }}
---
# One database per standalone product, declared: CloudNativePG creates it if missing and never drops it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $name }}-{{ . | replace "_" "-" }}
  namespace: {{ $ns }}
spec:
  name: {{ . }}
  owner: {{ $pg.username }}
  cluster:
    name: {{ $name }}
  ensure: present
  databaseReclaimPolicy: retain
{{- end }}
---
# The operator polls each instance's status on 8000 and connects on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}-operator
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.operatorNamespaces.postgres }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 8000, protocol: TCP }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}-clients
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "datastores.clients" (dict "root" $ "ns" $ns "cidrs" list) | trim | nindent 8 }}
      ports:
        - { port: 5432, protocol: TCP }
{{- end }}
{{- end }}
