{{- /*
One Redis per instance, every object named redis-<instance> so all instances can share one namespace,
reached in both runtimes at redis-<instance>.<namespace>.svc.cluster.local:6379 with the password given.

maxmemory is three quarters of the container limit: an RDB save forks Redis, and every key written
during the save is copied, so memory briefly rises above the data size. noeviction makes a full Redis
refuse writes (visible errors) instead of silently dropping queued work
(docs.langchain.com/langsmith/self-host-external-redis).

The password is in one Secret per instance, redis-<instance>-credentials (`password`, and `auth.conf`,
its requirepass line), in both runtimes; with existingSecrets the chart renders none and reads the one
an external secret store writes, since a password in values cannot reach Argo CD from git.

statefulset: the official image. redis.conf (a ConfigMap) includes auth.conf, mounted from the Secret as
a file: never on the command line, where root on the node could read it in /proc.

operator: an OpsTree RedisReplication (github.com/OT-CONTAINER-KIT/redis-operator), with three
Sentinels when replicas is above 1. The operator's own Service named after the resource selects every
pod, primary and replica alike, so the resource is named redis-<instance>-replication and a Service
named redis-<instance> selects the primary by the redis-role label the operator keeps current.
*/ -}}
{{- range $key, $r := .Values.redis.instances }}
{{- if $r.enabled }}
{{- $ns := include "datastores.ns" (dict "root" $ "ns" $r.namespace) }}
{{- $name := printf "redis-%s" $key }}
{{- $replication := printf "%s-replication" $name }}
{{- $password := "" }}
{{- if not $.Values.existingSecrets }}
{{- $password = required (printf "redis.instances.%s.password is required" $key) $r.password }}
{{- end }}
{{- $limitMi := include "datastores.mebibytes" $r.resources.limits.memory | int }}
{{- $selector := dict "langsmith.lab/datastore-instance" $name }}
{{- $labels := merge (dict "app.kubernetes.io/name" "redis") $selector $.Values.datastoreLabel }}
{{- $persistence := ternary (list "appendonly yes" "appendfsync everysec" "save \"\"") (list "appendonly no" "save 900 1" "save 300 10" "save 60 10000") (eq $r.persistence "aof") }}
{{- /* LangSmith writes about 2.5 short-TTL keys per run. With the defaults (hz 10, active-expire-effort 1)
expiry fell behind at about 800 runs/s: 23% of keys were expired but not freed, about 1 GB of a 3 GiB
Redis (measured under load). These freed it in seconds for about 0.3 CPU. */ -}}
{{- $tuning := list (printf "maxmemory %dmb" (div (mul $limitMi 3) 4)) (printf "maxmemory-policy %s" $r.maxmemoryPolicy) "hz 50" "active-expire-effort 5" }}
{{- if not $.Values.existingSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-credentials
  namespace: {{ $ns }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  auth.conf: {{ printf "requirepass %s" $password | quote }}
{{- end }}
{{- if eq $.Values.runtime "statefulset" }}
{{- if ne (int $r.replicas) 1 }}
{{- fail (printf "redis.instances.%s.replicas: runtime statefulset runs one Redis; replicas need runtime operator" $key) }}
{{- end }}
{{- $conf := printf "%s\n" (concat (list "bind 0.0.0.0" "port 6379" "dir /data" "databases 16" "include /usr/local/etc/redis-auth/auth.conf") $tuning $persistence | join "\n") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $ns }}
data:
  redis.conf: |
    {{- trimSuffix "\n" $conf | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
      annotations:
        # Restart Redis when its config or the password the chart was given changes.
        checksum/config: {{ printf "%s%s" $conf $password | sha256sum }}
    spec:
      # SIGTERM makes Redis save (RDB) or fsync (AOF) before exiting.
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          {{- include "datastores.antiAffinityTerms" $ | nindent 10 }}
      containers:
        - name: redis
          image: {{ $.Values.redis.image }}
          # args, not command: command would replace the image's entrypoint, which chowns /data and
          # drops to the redis user (uid 999). With command, redis-server runs as root.
          args: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          env:
            # Read by redis-cli in the probes only, never by redis-server.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-credentials
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: auth
              mountPath: /usr/local/etc/redis-auth
              readOnly: true
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          # Redis restarts fast and reloads from /data, so a liveness probe is safe here (unlike
          # Postgres crash recovery).
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: auth
          secret:
            secretName: {{ $name }}-credentials
            items:
              - key: auth.conf
                path: auth.conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "datastores.claimSpec" (dict "root" $ "ns" $ns "name" $name "size" $r.volumeSize) | nindent 8 }}
{{ include "datastores.pdb" (dict "name" $name "ns" $ns "labels" $labels "selector" $selector) }}
{{- else }}
---
# Included last in the operator's redis.conf, so these lines win over its own (it turns AOF on for any
# persistent store).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-additional-config
  namespace: {{ $ns }}
data:
  redis-additional.conf: |
    {{- concat (list "databases 16") $tuning $persistence | join "\n" | nindent 4 }}
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: {{ $replication }}
  namespace: {{ $ns }}
  # The operator copies these onto the pods: the client NetworkPolicy and the anti-affinity select them.
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  clusterSize: {{ $r.replicas }}
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: {{ $.Values.redis.operatorImage }}
    imagePullPolicy: IfNotPresent
    resources:
      {{- toYaml $r.resources | nindent 6 }}
    redisSecret:
      name: {{ $name }}-credentials
      key: password
  redisConfig:
    additionalRedisConfig: {{ $name }}-additional-config
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $.Values.storageClass }}
        resources:
          requests:
            storage: {{ $r.volumeSize }}
  affinity:
    podAntiAffinity:
      {{- include "datastores.antiAffinityTerms" $ | nindent 6 }}
  {{- if gt (int $r.replicas) 1 }}
  # Three Sentinels, a quorum of two, watch the primary and promote a replica when it fails; the
  # operator then moves the redis-role label, and the Service below with it.
  sentinel:
    image: {{ $.Values.redis.sentinelImage }}
    imagePullPolicy: IfNotPresent
    size: 3
    resources:
      {{- toYaml $.Values.redis.sentinelResources | nindent 6 }}
  {{- end }}
---
# The name the StatefulSet's Service has, on the primary only: a ClusterIP, so a failover moves the
# endpoint and no client keeps a replica's address.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    app: {{ $replication }}
    redis-role: master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# The operator configures replication and reads roles on 6379; Sentinels answer it on 26379.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}-operator
  namespace: {{ $ns }}
spec:
  # The resource's labels reach its Redis and Sentinel pods alike.
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.operatorNamespaces.redis }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - { port: 6379, protocol: TCP }
        - { port: 26379, protocol: TCP }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}-clients
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "datastores.clients" (dict "root" $ "ns" $ns "cidrs" $r.allowedCidrs) | trim | nindent 8 }}
      ports:
        - { port: 6379, protocol: TCP }
{{- end }}
{{- end }}
