{{- if .Values.routeTimeout }}
# Request timeout for every route on the Gateway (the LangSmith chart's HTTPRoute
# and the LAN catch-all). Envoy Gateway's default is 15 s, which turns slow
# SmithDB reads into HTTP 504; nginx in the chart allows 300 s.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.gatewayName }}-timeouts
  namespace: {{ required "gatewayNamespace is required" .Values.gatewayNamespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayName }}
  timeout:
    http:
      requestTimeout: {{ .Values.routeTimeout | quote }}
{{- end }}
