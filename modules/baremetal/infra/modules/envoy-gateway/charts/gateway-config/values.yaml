# Set by Terraform (modules/envoy-gateway/main.tf).
envoyProxyName: langsmith-proxy
gatewayClassName: langsmith-eg
gatewayName: langsmith-gateway
gatewayNamespace: ""
loadBalancerIP: ""
proxyReplicas: 1
proxyResources: {}
# Nodes the proxy pods may run on (the root's envoy_proxy_node_selector); {} for anywhere.
proxyNodeSelector: {}
# Request timeout for the chart's route and the LAN route (BackendTrafficPolicy); empty = Envoy default (15 s).
routeTimeout: "60s"
# The LangSmith chart's HTTPRoute: the release's full name (deploy.sh installs release "langsmith").
chartRouteName: langsmith
# An HTTPS listener for this hostname, from a kubernetes.io/tls Secret in the Gateway's namespace; null for none.
tls: null
lanRoute:
  enabled: false
  backendService: langsmith-frontend
  backendPort: 80
