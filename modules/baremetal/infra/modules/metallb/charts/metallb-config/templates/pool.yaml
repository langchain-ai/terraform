# The gateway's own pool: one address, never handed out automatically, so no
# other LoadBalancer Service can take it. The Envoy Service claims it with the
# metallb.io/loadBalancerIPs annotation.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: langsmith-gateway
spec:
  addresses:
    - {{ required "gatewayIP is required" .Values.gatewayIP }}/32
  autoAssign: false
---
# Everything else: other LoadBalancer Services on the cluster. Excludes the
# gateway IP (Terraform checks that).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
spec:
  addresses:
    {{- required "addresses must not be empty" .Values.addresses | toYaml | nindent 4 }}
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
spec:
  ipAddressPools:
    - langsmith-gateway
    - lan-pool
  {{- with .Values.l2NodeSelector }}
  nodeSelectors:
    - matchLabels:
        {{- toYaml . | nindent 8 }}
  {{- end }}
