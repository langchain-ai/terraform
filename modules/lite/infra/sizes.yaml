# How big each pod and volume on the box is, and what the box costs. Data, read by sizing.tf, whose
# blocks follow SIZING.md's computation in order; SIZING.md explains every number.
#
# Units: cpu_m millicores, mem_mi MiB, *_gi GiB, kb decimal kilobytes, usd US dollars. A request is
# what the scheduler reserves and what the fit adds up; a limit is the ceiling a pod may burst to.

# LangSmith's own services follow a model measured on the bare-metal lab: cores at idle (base) plus
# cores per unit of work (per_unit), times headroom, never below min_cpu_m. Work is the design rate in
# runs a second (offered: what clients send; processed: what the workers drain), or the readers at once,
# or nothing (fixed). Memory is the sampled peak.
# Source: bare-metal lab runs at 3 runs a trace and about 180 KiB a run, 5 s samples over ten minutes,
# 2026-10-31 and 2026-11-01 (Reed Bender); the sizing calculator's lite.measured parameters.
model:
  headroom: 1.5
  min_cpu_m: 50
  workloads:
    # Go services keep a 2-CPU limit: Go sets GOMAXPROCS to the limit, and under a 1-CPU limit
    # ingest-queue was throttled in 98% of periods at 4.3 traces/s on the lab (2026-10-22;
    # terraform#513, Michael Frederick).
    platformBackend: { work: offered, base: 0.003, per_unit: 0.0045, mem_mi: 512, lim_cpu_m: 2000 }
    ingestQueue: { work: processed, base: 0.025, per_unit: 0.035, mem_mi: 1126, lim_cpu_m: 2000 }
    queue: { work: processed, base: 0.082, per_unit: 0.0058, mem_mi: 1638, lim_cpu_m: 1000 }
    frontend: { work: readers, base: 0.001, per_unit: 0.0214, mem_mi: 128, lim_cpu_m: 500 }
    # backend and playground import many Python modules at start: a higher CPU limit lets them start
    # inside their startup probes.
    backend: { work: readers, base: 0.013, per_unit: 0.0012, mem_mi: 973, lim_cpu_m: 2000 }
    # Not tracing: each runs only when its feature is on.
    playground: { work: fixed, base: 0.005, per_unit: 0, mem_mi: 922, lim_cpu_m: 1000, feature: playground }
    aceBackend: { work: fixed, base: 0.001, per_unit: 0, mem_mi: 128, lim_cpu_m: 250, feature: code_evaluators }
  mem_limit_factor: 2
  mem_limit_floor_mi: 256

# What a run costs the stores, and how long they keep it. Source: LangChain trace payload measurements
# and load tests of LangSmith 0.17.6 with SmithDB, 2026-11 (Dzmitry Dubarau), the sizing calculator's
# payload.* and retention.* parameters.
storage:
  # Run sizes: small 4 + 4 KiB, medium 32 + 32 KiB, large about 1.5 MB (inputs + outputs).
  mix_pct: { small: 70, medium: 25, large: 5 }
  smithdb_kb: { small: 3.75, medium: 15, large: 112 }
  blob_kb: { small: 0, medium: 38, large: 84 }
  redis_kb: { small: 9.7, medium: 2.9, large: 12 }
  # The design rate is the busiest minute; storage fills at the average, the peak over this.
  peak_factor: 3
  # SmithDB deletes expired data about this long after the TTL; the blob bucket has no lag.
  smithdb_delete_lag_days: 5
  # Object storage capacity above the steady-state bytes (headroom.storage).
  headroom: 1.2
  # SmithDB's query cache holds the hot window, never less than this.
  cache_min_gi: 10

# Redis holds each run until ingest-queue drains it. Its maxmemory holds a stalled ingest at the peak
# for the whole run expiry, with headroom (headroom.redis); its limit leaves a quarter more for the fork
# of a save, and its request equals its limit, so the memory is reserved.
redis:
  headroom: 1.3
  maxmemory_share: 0.75
  min_maxmemory_mi: 256
  # CPU: little at rest; a 2-CPU limit, since every drain step goes through it and it throttled in 25% of
  # periods at 1 CPU on the bare-metal lab.
  cpu_m: 50
  lim_cpu_m: 2000

# Postgres connections: an API pod (platform-backend, backend) opens up to pool_api_pod (postgres.
# pool_api_pod); a worker (queue, ingest-queue) the chart's ASYNCPG_POOL_MAX_SIZE; others are SmithDB's
# metastore, migrations and the exporter. max_connections keeps them within the budget
# (postgres.connection_budget), rounded up to round_to.
postgres:
  pool_api_pod: 50
  pool_worker_pod: 3
  others: 20
  budget: 0.8
  round_to: 50
  min_connections: 100

# One machine holds up to this peak: the sizing calculator's extra-lite regime ends at 5 traces/s (50 runs
# a second at 10 runs a trace). Past it, the plan refuses and names the cloud modules.
single_machine_max_runs_per_second: 50

# The box presets. machine is the box Lite plans for; design the load its pods and stores are sized for,
# the most each machine's CPU holds; reserved what k3s, the kubelet and the OS keep (given to the kubelet
# as system-reserved). features turns the observability stack and Mission Control on or off for the
# preset: xs runs neither, as an instance a fleet watches from one shared stack. aws is the instance
# type with the machine's vCPUs and memory.
#
# SmithDB runs as one unified pod (chart 0.18), whose smallest chart tier asks 4 CPU and 16 GiB. Its
# sizes here are the bare-metal module's tested minimal tier for the pods it replaces, not yet measured
# as one pod. ponytail: unmeasured unified SmithDB; the first install of each box measures it.
boxes:
  xs:
    machine: { cpu: 2, memory_gi: 16, disk_gi: 80 }
    aws: r7i.large
    design: { runs_per_second: 1, readers: 1 }
    reserved: { cpu_m: 400, mem_mi: 1024 }
    features: { observability: false, mission_control: false }
    smithdb: { cpu_m: 500, mem_mi: 2048, lim_cpu_m: 2000, lim_mem_mi: 4096 }
    postgres: { cpu_m: 50, mem_mi: 512, lim_cpu_m: 1000, volume_gi: 10 }
    rustfs: { cpu_m: 100, mem_mi: 512, lim_cpu_m: 1000, lim_mem_mi: 2048 }
    prometheus: { volume_gi: 10 }
  s:
    machine: { cpu: 4, memory_gi: 16, disk_gi: 160 }
    aws: m7i.xlarge
    design: { runs_per_second: 5, readers: 2 }
    reserved: { cpu_m: 500, mem_mi: 1536 }
    features: { observability: true, mission_control: true }
    smithdb: { cpu_m: 750, mem_mi: 3072, lim_cpu_m: 2000, lim_mem_mi: 6144 }
    postgres: { cpu_m: 100, mem_mi: 768, lim_cpu_m: 1000, volume_gi: 10 }
    rustfs: { cpu_m: 100, mem_mi: 768, lim_cpu_m: 2000, lim_mem_mi: 3072 }
    prometheus: { volume_gi: 10 }
  m:
    machine: { cpu: 8, memory_gi: 32, disk_gi: 600 }
    aws: m7i.2xlarge
    design: { runs_per_second: 25, readers: 5 }
    reserved: { cpu_m: 750, mem_mi: 2048 }
    features: { observability: true, mission_control: true }
    smithdb: { cpu_m: 2000, mem_mi: 8192, lim_cpu_m: 4000, lim_mem_mi: 12288 }
    postgres: { cpu_m: 250, mem_mi: 1536, lim_cpu_m: 2000, volume_gi: 20 }
    # 6 GiB limit, as the bare-metal lab profile: RustFS was OOM-killed 9 times at 2 GiB under about
    # 70 to 80 traces/s of SmithDB flushes, and each kill failed SmithDB's writes.
    rustfs: { cpu_m: 250, mem_mi: 2048, lim_cpu_m: 4000, lim_mem_mi: 6144 }
    prometheus: { volume_gi: 20 }
  l:
    machine: { cpu: 16, memory_gi: 64, disk_gi: 1024 }
    aws: m7i.4xlarge
    design: { runs_per_second: 50, readers: 10 }
    reserved: { cpu_m: 1000, mem_mi: 3072 }
    features: { observability: true, mission_control: true }
    smithdb: { cpu_m: 4000, mem_mi: 16384, lim_cpu_m: 8000, lim_mem_mi: 24576 }
    postgres: { cpu_m: 500, mem_mi: 3072, lim_cpu_m: 4000, volume_gi: 50 }
    rustfs: { cpu_m: 500, mem_mi: 4096, lim_cpu_m: 4000, lim_mem_mi: 8192 }
    prometheus: { volume_gi: 40 }

# Pods whose size does not move with the load, each under the feature that runs it: the observability
# stack, Mission Control (its chart's own requests), cloudflared for a tunnel, and what k3s runs with
# requests (CoreDNS and metrics-server, from k3s's packaged manifests; Traefik and local-path ask nothing).
fixed:
  prometheus: { cpu_m: 100, mem_mi: 512, lim_cpu_m: 1000, lim_mem_mi: 1536, feature: observability }
  kube-state-metrics: { cpu_m: 10, mem_mi: 64, lim_cpu_m: 100, lim_mem_mi: 128, feature: observability }
  node-exporter: { cpu_m: 10, mem_mi: 32, lim_cpu_m: 200, lim_mem_mi: 64, feature: observability }
  grafana: { cpu_m: 50, mem_mi: 192, lim_cpu_m: 500, lim_mem_mi: 512, feature: observability }
  redis-exporter: { cpu_m: 10, mem_mi: 32, lim_cpu_m: 100, lim_mem_mi: 64, feature: observability }
  postgres-exporter: { cpu_m: 10, mem_mi: 48, lim_cpu_m: 100, lim_mem_mi: 128, feature: observability }
  mission-control-backend: { cpu_m: 250, mem_mi: 256, lim_cpu_m: 500, lim_mem_mi: 512, feature: mission_control }
  mission-control-frontend: { cpu_m: 100, mem_mi: 128, lim_cpu_m: 200, lim_mem_mi: 256, feature: mission_control }
  cloudflared: { cpu_m: 50, mem_mi: 64, lim_cpu_m: 500, lim_mem_mi: 256, feature: tunnel }
  k3s-coredns: { cpu_m: 100, mem_mi: 70, lim_cpu_m: 0, lim_mem_mi: 170, feature: k3s }
  k3s-metrics-server: { cpu_m: 100, mem_mi: 70, lim_cpu_m: 0, lim_mem_mi: 0, feature: k3s }

# Disk the box needs beyond the volumes: the operating system, the images and the logs. On AWS it is the
# root volume's size; the volumes go on a data volume of their own.
system_disk_gi: 40

# What the box costs a month, for the plan's estimate: AWS's on-demand list prices for Linux in
# us-east-1 (us-west-2 is the same for these). Not fetched by the plan: a region, a reservation or a
# discount changes them; aws_hourly_usd overrides the instance's.
aws_prices:
  hours_a_month: 730
  instance_hourly_usd: { r7i.large: 0.1323, m7i.xlarge: 0.2016, m7i.2xlarge: 0.4032, m7i.4xlarge: 0.8064 }
  gp3_gb_month_usd: 0.08
  snapshot_gb_month_usd: 0.05
  public_ipv4_hourly_usd: 0.005
