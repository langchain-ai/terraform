# What a healthy install looks like, as data: each signal is one alert rule (at its critical level) and one
# panel on the health dashboard's tab (with both levels), so the two never disagree (values.tf renders
# both). The SmithDB signals are Steffen Hausmann's "Recommended SmithDB alerts" (LangSmith docs,
# self-host-smithdb-alerts, 2026-11), numbered as there; their metric names are checked against SmithDB's
# critical export list (crates/smithdb-common/src/metrics_export.rs) and the chart's dashboard at 0.18.2.
# Capacity signals are the bounds Lite's plan sizes (SIZING.md).
#
#   expr      PromQL; {ns} matches LangSmith's namespaces, {data} the stores', {mount} the data disk's mount.
#             Every LangSmith and SmithDB signal is grouped by namespace: one alert, and one line, an install,
#             so one Grafana can watch many installs in one cluster by widening {ns}. Redis, Postgres and the
#             disks are read from the box's exporters, which carry no install's namespace: one a box.
#   unit      Grafana's unit for the panel: percent (0 to 100), s, short
#   warn      the early signal, shown on the dashboard; null for none
#   crit      the level the alert fires above; none with observe: true, which is shown and never alerted
#   for       how long it must hold before the alert fires
#   severity  urgent (runs are lost or users see errors now) or non-urgent (respond in a working day)
#   no_data   alerting when a missing series is itself the failure; otherwise a missing series is quiet
#   when      data_disk: only when the data has a disk of its own
#   zero_when_absent  a series that appears only on its first event: its tile reads 0, not "not read"
#
# Not here: panics (SmithDB alert 13) are read from logs, and Lite runs no log store; the metastore's
# storage (6) is the data disk's, which local-path cannot report per volume.

tabs:
  - Ingestion
  - Writes and queries
  - Compaction
  - Stores and pods
  - Capacity

signals:
  - id: runs-lost
    tab: Ingestion
    title: Ingestion tasks failed their last attempt (alert 1)
    expr: sum by (namespace) (increase(langsmith_ingest_task_failures_total{namespace=~"{ns}",attempt="12"}[15m]))
    # The counter exists only after the first failure: none is a healthy zero, not an unread signal.
    zero_when_absent: true
    unit: short
    crit: 0
    for: 0m
    severity: urgent
    action: Runs are lost. Writes to SmithDB have failed for about 2.5 hours; read smithdb's logs.

  - id: redis-evictions
    tab: Ingestion
    title: Redis evicted keys (alert 1)
    expr: sum(increase(redis_evicted_keys_total[5m])) or vector(0)
    unit: short
    crit: 0
    for: 0m
    severity: urgent
    action: Runs may be lost. Give Redis more memory (redis_runs_expiry_hours and the plan size it).

  - id: backlog-age
    tab: Ingestion
    title: Oldest pending ingestion task (alert 2)
    expr: max by (namespace) (max_over_time(langsmith_asynq_queue_latency_seconds{namespace=~"{ns}",queue=~"ingestion.*"}[10m]))
    unit: s
    warn: 600
    crit: 1800
    for: 0m
    severity: urgent
    action: Runs wait in Redis and near their expiry. Is ingest-queue throttled, or SmithDB slow to write?

  - id: backlog-retries
    tab: Ingestion
    title: Ingestion tasks waiting for a retry (alert 2)
    expr: max by (namespace) (langsmith_asynq_ingestion_queue_retry{namespace=~"{ns}"})
    unit: short
    warn: 100
    crit: 1000
    for: 30m
    severity: urgent
    action: Writes are failing and being retried; read ingest-queue's and smithdb's logs.

  - id: redis-memory
    tab: Ingestion
    title: Redis memory of maxmemory (alert 3)
    expr: 100 * max(redis_memory_used_bytes) / max(redis_memory_max_bytes)
    unit: percent
    warn: 80
    crit: 90
    for: 10m
    severity: urgent
    action: A backlog is filling Redis, or Redis is too small for the load; at the limit it evicts runs.

  - id: write-failures
    tab: Writes and queries
    title: SmithDB writes that failed (alert 4)
    expr: 100 * sum by (namespace) (increase(server_requests_duration_count{namespace=~"{ns}",type="grpc",path=~"(?i)/ingestion\\.ingestionservice/.*",status!="0"}[15m])) / sum by (namespace) (increase(server_requests_duration_count{namespace=~"{ns}",type="grpc",path=~"(?i)/ingestion\\.ingestionservice/.*"}[15m]))
    # A few failures at little traffic are a large share: the page asks 50 failures before it pages.
    guard: sum by (namespace) (increase(server_requests_duration_count{namespace=~"{ns}",type="grpc",path=~"(?i)/ingestion\\.ingestionservice/.*",status!="0"}[15m])) >= 50
    unit: percent
    warn: 1
    crit: 5
    for: 15m
    severity: urgent
    action: SmithDB cannot make data durable. Check the object store (RustFS) and the metastore (Postgres).

  - id: query-failures
    tab: Writes and queries
    title: SmithDB queries that failed (alert 5)
    expr: 100 * sum by (namespace) (increase(server_requests_duration_count{namespace=~"{ns}",path=~"(?i)/query\\.queryservice/.*",status=~"2|4|8|13|14|15|error|timeout"}[15m])) / sum by (namespace) (increase(server_requests_duration_count{namespace=~"{ns}",path=~"(?i)/query\\.queryservice/.*"}[15m]))
    unit: percent
    warn: 5
    crit: 10
    for: 15m
    severity: urgent
    action: Users see errors or empty pages. Usually slow queries first; check compaction and SmithDB's memory.

  - id: slow-writes
    tab: Writes and queries
    title: SmithDB write latency, median (alert 7)
    expr: histogram_quantile(0.5, sum by (namespace, le) (rate(ingest_batch_latency_bucket{namespace=~"{ns}"}[15m])))
    unit: s
    warn: 1.6
    crit: 2
    for: 15m
    severity: non-urgent
    action: Healthy is 0.5 to 0.7 s. Slow writes come before a backlog; check the object store and the metastore.

  - id: slow-queries
    tab: Writes and queries
    title: SmithDB query latency, p95 (alert 8)
    expr: histogram_quantile(0.95, sum by (namespace, le) (rate(server_requests_duration_bucket{namespace=~"{ns}",path=~"(?i)/query\\.queryservice/.*",path!~"(?i).*/(ingestfeedback|deleteruns)"}[15m])))
    unit: s
    warn: 10
    crit: 20
    for: 15m
    severity: non-urgent
    action: Pages load slowly. Usually compaction is behind; it is cheaper to fix early.

  - id: compaction-backlog
    tab: Compaction
    title: Compaction jobs pending (alert 9)
    expr: sum by (namespace) (compaction_queue_job_count{namespace=~"{ns}",status="pending"})
    unit: short
    crit: 1000
    for: 2h
    severity: non-urgent
    action: "Queries read more segments each day. On one box, SmithDB needs more CPU: a larger box."

  - id: compaction-stopped
    tab: Compaction
    title: Compaction stopped, jobs waiting and none running (alert 10)
    expr: (sum by (namespace) (compaction_queue_job_count{namespace=~"{ns}",status="pending"}) > bool 0) unless on (namespace) (sum by (namespace) (compaction_worker_running_tasks{namespace=~"{ns}"}) > 0)
    unit: short
    crit: 0
    for: 30m
    severity: non-urgent
    action: Compaction makes no progress; read smithdb's logs.

  - id: compaction-failures
    tab: Compaction
    title: Compaction jobs that failed, worst kind (alert 10)
    expr: 100 * max by (namespace) (sum by (namespace, job_kind) (increase(compaction_job_completion{namespace=~"{ns}",status="failure",job_kind=~".*_compaction"}[1h])) / sum by (namespace, job_kind) (increase(compaction_job_completion{namespace=~"{ns}",job_kind=~".*_compaction"}[1h])))
    unit: percent
    warn: 20
    crit: 50
    for: 0m
    severity: non-urgent
    action: One kind of job fails again and again, often too large for SmithDB's memory.

  - id: metastore-connections
    tab: Stores and pods
    title: Postgres connections of max_connections (alert 6)
    expr: 100 * sum(pg_stat_activity_count) / max(pg_settings_max_connections)
    unit: percent
    warn: 80
    crit: 90
    for: 5m
    severity: urgent
    action: At the limit, writes fail. postgres_max_connections, or fewer pods.

  - id: metastore-cpu
    tab: Stores and pods
    title: Postgres CPU of its limit (alert 6)
    expr: 100 * sum(rate(container_cpu_usage_seconds_total{namespace="{data}",pod=~"postgres.*",container!=""}[15m])) / sum(kube_pod_container_resource_limits{namespace="{data}",pod=~"postgres.*",resource="cpu"})
    unit: percent
    warn: 60
    crit: 80
    for: 15m
    severity: urgent
    action: A slow metastore slows ingestion, queries and compaction at once. Raise Postgres's CPU (resources).

  - id: no-pods
    tab: Stores and pods
    title: Deployments with no available pod (alert 11)
    # Every LangSmith Deployment that should run, not SmithDB's alone: on one box any of them down is an outage.
    # One scaled to zero on purpose (playground, ace-backend) is left out.
    expr: count by (namespace) ((kube_deployment_status_replicas_available{namespace=~"{ns}"} < 1) unless on (namespace, deployment) (kube_deployment_spec_replicas{namespace=~"{ns}"} == 0)) or on (namespace) (0 * count by (namespace) (kube_deployment_spec_replicas{namespace=~"{ns}"}))
    unit: short
    crit: 0
    for: 10m
    severity: urgent
    no_data: true
    action: A component is down, and its own alerts go quiet with it. make status shows which.

  - id: restarts
    tab: Stores and pods
    title: Most restarts of one pod in 30 minutes (alert 12)
    expr: max by (namespace) (increase(kube_pod_container_status_restarts_total{namespace=~"{ns}|{data}"}[30m]))
    unit: short
    # increase() extrapolates, so one restart can read 0.9 or 1.1: the levels sit between whole counts.
    warn: 0.5
    crit: 2.5
    for: 0m
    severity: non-urgent
    action: Usually a pod over its memory limit (OOM). The first sign a component is too small.

  - id: data-disk
    tab: Capacity
    title: Data disk used
    when: data_disk
    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="{mount}"} / node_filesystem_size_bytes{mountpoint="{mount}"})
    unit: percent
    warn: 80
    crit: 90
    for: 10m
    severity: urgent
    action: The stores outgrew the plan. Shorter TTLs, or a larger data disk (make up).

  - id: system-disk
    tab: Capacity
    title: System disk used
    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
    unit: percent
    warn: 80
    crit: 90
    for: 10m
    severity: urgent
    action: Images and logs fill the system disk; k3s evicts pods at 90%. Prune images, or a larger disk.

  - id: pod-memory
    tab: Capacity
    title: Pod memory of its limit, the highest pod
    expr: 100 * max(max by (pod) (container_memory_working_set_bytes{namespace=~"{ns}|{data}",container!=""}) / max by (pod) (kube_pod_container_resource_limits{namespace=~"{ns}|{data}",resource="memory"}))
    unit: percent
    warn: 80
    crit: 95
    for: 10m
    severity: non-urgent
    action: A pod near its limit is OOM-killed next. Raise it (resources), or a larger box.

  - id: cpu-throttled
    tab: Capacity
    title: CPU throttled, the most throttled pod
    expr: 100 * max(sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=~"{ns}|{data}"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=~"{ns}|{data}"}[5m])))
    unit: percent
    # No level: no measurement says how much throttling hurts which pod; shown, never alerted.
    observe: true
    for: 0m
    severity: non-urgent
    action: A throttled Go pod (platform-backend) stalls for the rest of its window; raise its CPU limit.
