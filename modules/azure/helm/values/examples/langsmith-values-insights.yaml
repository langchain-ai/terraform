# Insights — ClickHouse-backed analytics.
#
# init-values.sh generates ../langsmith-values-insights.yaml directly when
# enable_insights = true, so this file is a reference copy for the manual path:
#   cp examples/langsmith-values-insights.yaml ../langsmith-values-insights.yaml
#
# This overlay only turns the feature on. Where ClickHouse lives is a separate
# decision, made by clickhouse_source in terraform.tfvars and written into
# values-overrides.yaml by init-values.sh:
#
#   clickhouse_source = "in-cluster"  → the chart runs ClickHouse as a StatefulSet
#   clickhouse_source = "external"    → the chart skips it and reads the connection
#                                       from the langsmith-clickhouse secret
#
# For "external", init-values.sh prompts for host/ports/user/password/db/tls and
# creates that secret. The chart resolves every one of those fields through
# secretKeyRef, so all seven keys must be present:
#
#   clickhouse_host  clickhouse_port  clickhouse_native_port  clickhouse_user
#   clickhouse_password  clickhouse_db  clickhouse_tls
#
# NOTE: chart 0.15.1 removed config.insights → top-level insights block (migrated below).
# Chart 0.16 keeps that block. The external-ClickHouse path has NOT been validated on 0.16
# (only in-cluster was), so check the clickhouse block init-values.sh writes into
# values-overrides.yaml against the 0.16 insights schema before using it.

insights:
  enabled: true
  # encryptionKey is stored in Azure Key Vault and delivered via langsmith-config-secret.
  # Terraform creates the key automatically in Key Vault during `make apply`.
  # deploy.sh / make k8s-secrets pulls it and adds it to the langsmith-config-secret.
  # Do not set encryptionKey inline here — it is already in existingSecretName.
