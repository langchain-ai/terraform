# SmithDB scheduling overlay for LangSmith on Azure (chart 0.17+).
# Environment-specific storage, identity, and metastore values are generated by
# init-values.sh in langsmith-values-smithdb-overrides.yaml.

smithdb:
  enabled: true
  # Cache sizes and workload resources come from the chart's small tier. The
  # generated overrides select Terraform's Premium SSD v2 StorageClass.
  resourceTier: small

  query:
    deployment:
      nodeSelector:
        smithdb/cache: "true"
      tolerations:
        - key: smithdb/cache
          operator: Equal
          value: "true"
          effect: NoSchedule
  ingestion:
    deployment:
      nodeSelector:
        smithdb/cache: "true"
      tolerations:
        - key: smithdb/cache
          operator: Equal
          value: "true"
          effect: NoSchedule
  compactionWorker:
    deployment:
      nodeSelector:
        smithdb/cache: "true"
      tolerations:
        - key: smithdb/cache
          operator: Equal
          value: "true"
          effect: NoSchedule
  compaction:
    deployment:
      nodeSelector:
        smithdb-local/compute: "true"
      tolerations:
        - key: smithdb-local/compute
          operator: Equal
          value: "true"
          effect: NoSchedule
  clusterManager:
    deployment:
      nodeSelector:
        smithdb-local/compute: "true"
      tolerations:
        - key: smithdb-local/compute
          operator: Equal
          value: "true"
          effect: NoSchedule
