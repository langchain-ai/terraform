# SmithDB scheduling overlay for LangSmith on Azure.
# SmithDB requires a specific chart line — see SMITHDB.md, "Version requirements".
# init-values.sh merges this file into ../langsmith-values-overrides.yaml when
# enable_smithdb = true, and merges the storage, identity, and metastore values
# from Terraform outputs after it.

smithdb:
  enabled: true
  # The chart tier and replicas come from smithdb_sizing (the smithdb_helm_values
  # output), which init-values.sh merges before this file. The
  # generated overrides select Terraform's Premium SSD v2 StorageClass.
