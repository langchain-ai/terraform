# LangSmith Azure — Envoy Gateway Values
# ──────────────────────────────────────────────────────────────────────────────
# Use this overlay when ingress_controller = "envoy-gateway" in terraform.tfvars,
# the default.
#
# Prerequisites:
#   • terraform apply with ingress_controller = "envoy-gateway"
#     (installs the Envoy Gateway Helm chart in the envoy-gateway-system namespace;
#     the chart ships the Gateway API CRDs)
#   • make k8s-secrets
#   • make init-values  (sets ingress.enabled: false and gateway.enabled: true)
#   • make deploy       (creates the EnvoyProxy, GatewayClass and Gateway; the
#                        LangSmith chart renders the HTTPRoutes)
#
# How it works:
#   Envoy Gateway implements the Kubernetes Gateway API (GatewayClass → Gateway →
#   HTTPRoute), not classic Kubernetes Ingress. The LangSmith Helm chart ingress
#   block is disabled. Traffic flows:
#     Azure LB (envoy-gateway-system) → Envoy proxy → HTTPRoute → langsmith-frontend
#
# EnvoyProxy:     envoy-gateway-system/langsmith-proxy  (carries the dns_label annotation)
# GatewayClass:   langsmith-eg  (controller: gateway.envoyproxy.io/gatewayclass-controller,
#                 parametersRef → langsmith-proxy)
# Gateway:        <namespace>/langsmith-gateway
# LB service:     envoy-gateway-system/envoy-<namespace>-langsmith-gateway-<hash>
#                 kubectl get svc -n envoy-gateway-system \
#                   -l gateway.envoyproxy.io/owning-gateway-name=langsmith-gateway
#
# TLS:
#   letsencrypt and dns01 both issue through cert-manager's Gateway shim: the
#   Gateway's cert-manager.io/cluster-issuer annotation makes cert-manager issue
#   langsmith-tls for the HTTPS listener. letsencrypt uses the gatewayHTTPRoute
#   solver, which deploy.sh configures on the letsencrypt-prod ClusterIssuer:
#     solvers:
#     - http01:
#         gatewayHTTPRoute:
#           parentRefs:
#           - name: langsmith-gateway
#             namespace: <namespace>
#             kind: Gateway
#   Terraform enables cert-manager's Gateway API support on the cert-manager it
#   installs. With install_cert_manager = false, the cluster's own cert-manager
#   must run with it enabled.
#
# Hostname:
#   Set dns_label = "langsmith-prod" in terraform.tfvars
#   → langsmith-prod.<region>.cloudapp.azure.com
#   The EnvoyProxy puts the label on the Envoy proxy LB service when Envoy
#   Gateway creates it, so it resolves before the HTTP-01 challenge runs.
#
# LB IP:
#   kubectl get gateway langsmith-gateway -n <namespace> \
#     -o jsonpath='{.status.addresses[0].value}'
# ──────────────────────────────────────────────────────────────────────────────

# Disable the chart-managed Ingress — Gateway API is used instead.
ingress:
  enabled: false
istioGateway:
  enabled: false
