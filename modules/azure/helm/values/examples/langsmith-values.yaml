# Azure base Helm values for LangSmith.
#
# make init-values copies this file to ../langsmith-values.yaml on every run, and
# make deploy applies that copy first, then ../langsmith-values-overrides.yaml.
#
# Holds the Azure-native defaults that do NOT vary per deployment: the Azure Blob
# Storage engine and auth/secret conventions. Everything that varies per
# environment is in langsmith-values-overrides.yaml, which init-values.sh writes:
# hostname, admin email, storage account/container, Workload Identity client ID,
# ingress class and TLS, the external Postgres/Redis secret references, each
# enabled feature, and the sizing profile. Put your own changes in
# ../langsmith-values-local.yaml, not in the copy.
#
# Do NOT put secrets here. Secrets live in langsmith-config-secret (Key Vault →
# Terraform or create-k8s-secrets.sh) and are referenced via config.existingSecretName.

ingress:
  enabled: true
  # No class here. The overrides file sets one (istio,
  # azure-application-gateway) or disables Ingress (envoy-gateway, the default,
  # and istio-addon). With ingress_controller = "none" the cluster's default
  # IngressClass serves it; set ingressClassName in langsmith-values-local.yaml to
  # pick another.

istioGateway:
  enabled: false

# The chart defaults this to LoadBalancer, which gives the frontend its own public
# IP serving plain HTTP around the ingress. Every ingress controller here reaches
# it inside the cluster, so it needs no address of its own. With
# ingress_controller = "none", route your own ingress to the langsmith-frontend
# Service, or run `kubectl port-forward svc/langsmith-frontend 8080:80` for a
# first check.
frontend:
  service:
    type: ClusterIP

config:
  authType: "mixed"
  # Tells the chart to read every LangSmith secret (license, jwt, salt, admin
  # password, encryption keys) from this one K8s secret.
  existingSecretName: "langsmith-config-secret"
  basicAuth:
    enabled: true
  blobStorage:
    enabled: true
    engine: "Azure"
    # azureStorageAccountName + azureStorageContainerName are set in the overrides layer.

# The chart enables both by default, and init-values.sh merges their overlays
# only when enable_insights / enable_polly is true. Off here, so false means off.
insights:
  enabled: false

polly:
  enabled: false
