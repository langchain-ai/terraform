# ============================================================================
# ABSOLUTE MINIMUM — NOT FOR ANY REAL WORKLOAD
#
# This profile exists to keep LangSmith alive at the lowest possible cost.
# Single replica, rock-bottom resource requests sized from actual kubectl-top
# measurements on an idle cluster. The goal is to fit everything
# on a single small node (e.g. Standard_D4s_v3 — 4 vCPU, 16 GiB).
#
# WILL break under any meaningful traffic. OOM kills, timeouts, and degraded
# UX are expected and acceptable. Do not file bugs against this profile.
#
# Use cases: cost parking, weekend standby, CI smoke tests, demos with a
# single user clicking around.
#
# For actual dev work: use langsmith-values-sizing-dev.yaml
# For production:      use langsmith-values-sizing-production.yaml
#
# Requests start from those idle measurements, raised where a
# component could not start at the measured idle figure.
# With Deployments and Fleet on, the requests come to ~3.2 vCPU before system
# pods, so plan on two D4s_v3 nodes rather than one.
# ============================================================================

# -- Application components ----------------------------------------------------

backend:
  e2eTest:
    enabled: false
  deployment:
    replicas: 1
    resources:
      requests:
        # Requests are what the scheduler packs by. At 50m every pod fit on the
        # first node while the backend alone used ~300m, and nothing moved once
        # the autoscaler added more nodes.
        cpu: "250m"
        memory: "576Mi"
      limits:
        # At 500m it bound its port after the 60s startup budget and crash-looped
        # even on an idle node.
        cpu: "1"
        memory: "1Gi"
    startupProbe:
      failureThreshold: 12
      timeoutSeconds: 10

frontend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

platformBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

playground:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "25m"
        memory: "384Mi"
      limits:
        # Same image as backend above, so the same CPU. At the previous 250m the
        # container bound to its port just after the 60s startup-probe budget expired
        # and crash-looped. Measured at 500m: ready in 39s, 1 probe failure of 6.
        cpu: "500m"
        memory: "512Mi"
    # Only the two fields we change; Helm merges the rest, so path and port stay
    # whatever the chart says. Startup saturates the CPU limit, so a cold pull or a
    # busy node can outlast the chart's 60s.
    startupProbe:
      failureThreshold: 12
      timeoutSeconds: 10

queue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1"
        memory: "1536Mi"

ingestQueue:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

aceBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

# -- Deployments feature components --------------------------------------------

hostBackend:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        # Idles at ~480Mi. Below that the HPA's 80% memory target reads every
        # replica as over and scales straight to its maximum.
        memory: "640Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  # langsmith-values-agent-deploys.yaml turns the HPA on; one replica here.
  autoscaling:
    hpa:
      enabled: false

listener:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1"
        memory: "1536Mi"

operator:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"

# -- Fleet infrastructure (was Agent Builder; renamed in chart 0.15.0) ---------

fleetToolServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        # The chart's own limits. Under 1 CPU / 1536Mi its uvicorn workers died
        # and respawned on every start until the startup probe gave up.
        cpu: "2"
        memory: "4Gi"

fleetTriggerServer:
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "250m"
        memory: "384Mi"

# The chart sets no resources on these two, so they otherwise get the namespace
# LimitRange's 100m request while each uses ~500m starting up.
fleet:
  apiServer:
    deployment:
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
  queue:
    deployment:
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

# -- In-cluster data services (Tier 1 only) -----------------------------------
# ClickHouse is the one component that actually uses its resources.
# Don't go below this or queries will time out.

postgres:
  statefulSet:
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

redis:
  statefulSet:
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

clickhouse:
  statefulSet:
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
